name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Quality and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Checkout Backend OpenAPI contract
        uses: actions/checkout@v4
        with:
          repository: TonsPV/Homestay-Booking-Management-System
          ref: main
          path: backend-contract
          sparse-checkout: |
            docs/openapi.json
          sparse-checkout-cone-mode: false

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture check
        run: npm run architecture:check

      - name: Contract check
        env:
          HBMS_OPENAPI_SPEC_PATH: ${{ github.workspace }}/backend-contract/docs/openapi.json
        run: npm run contract:check

      - name: Contract negative test
        env:
          HBMS_OPENAPI_SPEC_PATH: ${{ github.workspace }}/backend-contract/docs/openapi.json
        run: npm run contract:test

      - name: Unit and component tests
        run: npm test

      - name: Production build
        env:
          VITE_API_ORIGIN: https://api.example.invalid
        run: npm run build

  e2e:
    name: Mocked Playwright E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mocked E2E
        run: npm run test:e2e
