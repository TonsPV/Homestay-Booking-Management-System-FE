name: Frontend CI and Vercel verification

on:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: read

concurrency:
  group: frontend-deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Quality gates and Vercel verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v7

      - name: Checkout Backend OpenAPI contract
        uses: actions/checkout@v7
        with:
          repository: TonsPV/Homestay-Booking-Management-System
          ref: main
          path: backend-contract
          sparse-checkout: |
            openapi/openapi.json
          sparse-checkout-cone-mode: false

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 22.13.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture check
        run: npm run architecture:check

      - name: Contract check against Backend OpenAPI
        env:
          HBMS_OPENAPI_SPEC_PATH: ${{ github.workspace }}/backend-contract/openapi/openapi.json
        run: npm run contract:check

      - name: Contract negative test
        env:
          HBMS_OPENAPI_SPEC_PATH: ${{ github.workspace }}/backend-contract/openapi/openapi.json
        run: npm run contract:test

      - name: Unit and component tests
        run: npm test

      - name: Production build with deployed Backend origin
        env:
          # Deployed Backend on Render; VITE_* values are public by design.
          VITE_API_ORIGIN: https://homestay-booking-management-system.onrender.com
        run: npm run build

      - name: Verify Vercel Git deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYMENT_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..30}; do
            deployment_id=$(gh api "repos/${REPOSITORY}/deployments?sha=${DEPLOYMENT_SHA}&environment=Production&per_page=1" --jq '.[0].id // empty')

            if [ -n "$deployment_id" ]; then
              state=$(gh api "repos/${REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" --jq '.[0].state // empty')
              environment_url=$(gh api "repos/${REPOSITORY}/deployments/${deployment_id}/statuses?per_page=1" --jq '.[0].environment_url // empty')

              case "$state" in
                success)
                  echo "Vercel deployment succeeded: $environment_url"
                  exit 0
                  ;;
                failure|error|inactive)
                  echo "Vercel deployment ended with state: $state"
                  exit 1
                  ;;
                *)
                  echo "Vercel deployment state: ${state:-not reported yet}"
                  ;;
              esac
            else
              echo "Waiting for Vercel to create the production deployment for ${DEPLOYMENT_SHA}"
            fi

            sleep 10
          done

          echo "Timed out waiting for the Vercel production deployment"
          exit 1

      - name: Smoke test deployed site
        run: |
          sleep 10
          status=$(curl -s -o /dev/null -w "%{http_code}" https://homestay-booking-management-system.vercel.app/)
          if [ "$status" != "200" ]; then
            echo "Smoke test failed: GET / returned $status"
            exit 1
          fi
          echo "Smoke test passed: GET / returned 200"
